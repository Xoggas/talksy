server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff|woff2|ttf|svg)$ {
        expires 1M;
        add_header Cache-Control "public";
    }
}
